
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              // Semantic Colors mapped to CSS Variables
              primary: 'var(--color-primary)',
              background: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              'on-surface': 'var(--color-text)',
              'muted': 'var(--color-text-secondary)',
              border: 'var(--color-border)',
              
              // Keep legacy for compatibility during migration, or map them too
              dark: {
                100: '#1E293B', 
                200: '#0F172A',
                300: '#0B1120'
              },
            },
            borderRadius: {
              'card': 'var(--radius)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Fallback values before JS loads */
        --color-primary: #4f46e5;
        --color-bg: #f9fafb;
        --color-surface: #ffffff;
        --color-text: #1f2937;
        --color-text-secondary: #6b7280;
        --color-border: #e5e7eb;
        --radius: 12px;
      }

      .card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .dark .card:hover {
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "@tabler/icons-react": "https://esm.sh/@tabler/icons-react@3.2.0?external=react,react-dom&bundle",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?external=react,react-dom&bundle",
    "@phosphor-icons/react": "https://esm.sh/@phosphor-icons/react@2.1.4?external=react,react-dom&bundle",
    "howler": "https://esm.sh/howler@2.2.4",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.0.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@^1.32.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
