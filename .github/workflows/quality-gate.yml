name: Gate de qualidade

# Nenhum commit chegava com testes vermelhos porque nada os executava: o
# repositório não tinha CI, e o gate era inteiramente manual (dívida registrada
# na auditoria de prontidão). Este workflow é o gate.
#
# Nenhum segredo é usado. As suítes rodam contra o Firebase Emulator, com dados
# sintéticos, e nada aqui toca projeto real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # O build do frontend inclui o catálogo completo de ícones, resolvido por
  # nome em tempo de execução. O passo de renderização do Rollup precisa de
  # heap acima do padrão.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-and-unit:
    name: Build e testes unitários (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 é o runtime declarado em `functions/package.json` e o que o deploy
        # usa; 22 é o que o ambiente de desenvolvimento executa hoje. Rodar os
        # dois é o que elimina a divergência "runtime implantado nunca
        # exercitado" apontada na auditoria.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Instalar dependências das Functions
        run: npm ci --prefix functions

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Lint das Functions
        # Formatação é aviso; correção é erro. Ver `functions/.eslintrc.js`.
        run: npm run functions:lint

      - name: Build do frontend
        run: npm run build

      - name: Build das Functions
        run: npm run functions:build

      - name: Testes unitários das Functions
        run: npm run functions:test:unit

      - name: Testes unitários do frontend
        run: npm run test:unit:investments

      - name: Testes unitários de dinheiro, sessão e workspaces
        run: npm run test:unit:p1

      - name: Testes unitários do cliente de billing
        run: npm run test:unit:billing

      - name: Testes unitários de interface
        run: npm run test:unit:ui

      - name: Testes unitários do caixa
        run: npm run test:unit:cash

      - name: Testes unitários de empréstimos e guarda de escritores
        run: npm run test:unit:loans

      - name: Testes unitários de clientes e recebíveis e guarda de escritores
        run: npm run test:unit:clients

      - name: Testes unitários de contas e transferências e guardas
        run: npm run test:unit:accounts

      - name: Testes unitários de cartões e guarda de escritores
        run: npm run test:unit:cards

      - name: Testes unitários de recorrentes (agenda D-12) e guardas
        run: npm run test:unit:recurring

      - name: Testes unitários da Divisão de contas (rateio exato) e guardas
        run: npm run test:unit:split

      - name: Testes unitários das notificações (estado privado, paginação, sem polling) e guardas
        run: npm run test:unit:notifications

      - name: Testes unitários das metas (fonte única, centavos, paginação) e guardas
        run: npm run test:unit:goals

      - name: Testes unitários do relatório oficial (adaptador, faixas, fuso)
        run: npm run test:unit:reports

      - name: Testes unitários do tempo de trabalho equivalente (cálculo, contrato e guardas de privacidade)
        run: npm run test:unit:work-time

      - name: Testes unitários do catálogo de configurações (P4-E) e guardas
        run: npm run test:unit:settings-catalog

      - name: Testes unitários do histórico do chat de IA (P5-A, isolamento por usuário e espaço)
        run: npm run test:unit:ai-chat

      - name: Testes do E2E oficial em grupos (executor e fiação)
        run: npm run test:tools:e2e

      - name: Testes do marco de fase completa da integração
        run: npm run test:tools:integracao

      - name: Varredura de segredos do bundle (testes da ferramenta)
        run: npm run test:tools:bundle

      - name: Contrato de ambientes, guard de publicação, piloto e Storage (testes das ferramentas)
        run: npm run test:tools:ambiente

  integration-and-rules:
    name: Integração e Firestore Rules
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Instalar dependências das Functions
        run: npm ci --prefix functions

      # A versão do Emulator é a validada no gate (P5-F.1-R3.2); trocar de versão é uma mudança explícita, não a mais
      # nova do dia.
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Cache dos emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Ensaio de restauração com amostra sintética (exportação e importação do Emulator)
        run: npm run test:operacao:restauracao

      - name: Suíte de integração e Rules no Emulator
        run: npm run test:integration:emulator

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Instalar dependências das Functions
        run: npm ci --prefix functions

      # A versão do Emulator é a validada no gate (P5-F.1-R3.2); trocar de versão é uma mudança explícita, não a mais
      # nova do dia.
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Cache dos emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      # O E2E roda contra o build de produção servido por `vite preview`, e não
      # contra o servidor de desenvolvimento: o grafo de módulos não empacotado
      # derrubava o renderer do Chromium por memória antes de qualquer
      # asserção. `test:e2e` já constrói antes de invocar o Playwright.
      #
      # `test:e2e` roda a suíte em grupos de arquivos, um depois do outro, cada
      # um com o próprio Emulator (`tools/e2e/executar-em-grupos.mjs`, P5-F.1-R3.2):
      # numa sessão só, o emulador de Functions acumulava um processo por função
      # e a memória passava de 14 GB. Os mesmos testes e asserções, sem nova
      # tentativa automática; a execução só passa com cada teste da lista
      # rodando uma vez e passando. Os relatórios e os logs do Emulator ficam
      # por grupo em `playwright-report/grupo-<n>/` e `test-results/grupo-<n>/`.
      - name: Suíte E2E
        run: npm run test:e2e

      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
